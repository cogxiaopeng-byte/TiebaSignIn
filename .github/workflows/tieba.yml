name: Daily Tieba Sign-In

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'  # UTC 22:30 = 北京时间次日 06:30

jobs:
  signin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sign-in account 1
        env:
          ACCOUNT_LABEL: 账号1
          BDUSS: ${{ secrets.BDUSS }}
          STOKEN: ${{ secrets.STOKEN }}
          SCKEY: ${{ secrets.SCKEY }}
        run: python run.py

      - name: Run sign-in account 2
        if: ${{ !cancelled() }}
        env:
          ACCOUNT_LABEL: 账号2
          BDUSS: ${{ secrets.BDUSS_2 }}
          STOKEN: ${{ secrets.STOKEN_2 }}
          SCKEY: ${{ secrets.SCKEY }}
        run: python run.py

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
